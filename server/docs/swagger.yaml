  /user/email/request-change:
    post:
      consumes:
      - application/json
      description: |-
        Sends a 6-digit code to the new email. The change is only applied
        after it is confirmed via /user/email/verify-change. Keeps the
        invite-only allowlist in sync (the new address is confirmed before
        it is allowlisted).
      parameters:
      - description: The new email address
        in: body
        name: payload
        required: true
        schema:
          properties:
            email:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Requests an email change by sending a verification code to the new
        address
      tags:
      - user
  /user/email/verify-change:
