      consumes:
      - application/json
      description: 'A whole-document replace, upserted on first save and idempotent
        thereafter. There is no DELETE: sending an empty string is how a note is cleared,
        and a second verb for one state transition is a second thing to keep consistent.'
      parameters:
      - description: Event ID
        in: path
        name: eventId
