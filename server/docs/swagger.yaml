  /user/avatar:
    delete:
      description: Idempotent — removing a photo that isn't there succeeds.
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Removes the signed-in user's profile photo
      tags:
      - user
    put:
      consumes:
      - application/json
      description: |-
        Accepts a base64 data URL (JPEG or PNG). The image is centre-cropped,
        downscaled to 256x256 and re-encoded as JPEG before storage, so EXIF
        metadata on the original is discarded.
      parameters:
      - description: Data URL of the image to store
        in: body
        name: payload
        required: true
        schema:
          properties:
            image:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              avatarUpdatedAt:
                type: integer
            type: object
        "400":
          description: invalid-image
          schema:
            $ref: '#/definitions/responses.Error'
        "413":
          description: image-too-large
          schema:
            $ref: '#/definitions/responses.Error'
      summary: Sets the signed-in user's profile photo
      tags:
      - user
  /user/calendar-options:
