        type: array
      error: {}
    type: object
  models.AppleCalendarAuth:
    type: object
  models.BufferTimeOptions:
    properties:
      enabled:
        type: boolean
      time:
        type: integer
    type: object
  models.CalendarAccount:
    properties:
      appleCalendarAuth:
        $ref: '#/definitions/models.AppleCalendarAuth'
      calendarType:
        $ref: '#/definitions/models.CalendarType'
      email:
        description: Email is required for all calendar accounts
        type: string
      enabled:
        type: boolean
      icsCalendarAuth:
        $ref: '#/definitions/models.ICSCalendarAuth'
      oAuth2CalendarAuth:
        $ref: '#/definitions/models.OAuth2CalendarAuth'
      picture:
        type: string
      subCalendars:
        additionalProperties:
          $ref: '#/definitions/models.SubCalendar'
        type: object
    type: object
  models.CalendarEvent:
    properties:
      allDay:
        description: Whether the event is an all day event
        type: boolean
      calendarId:
        type: string
      endDate:
        type: integer
      free:
        description: Whether the user is free during this event
        type: boolean
      id:
        type: string
      startDate:
        type: integer
      summary:
        type: string
    type: object
  models.CalendarOptions:
    properties:
      bufferTime:
        $ref: '#/definitions/models.BufferTimeOptions'
      workingHours:
        $ref: '#/definitions/models.WorkingHoursOptions'
    type: object
  models.CalendarType:
    enum:
    - apple
    - google
    - outlook
    - ics
    type: string
    x-enum-varnames:
    - AppleCalendarType
    - GoogleCalendarType
    - OutlookCalendarType
    - ICSCalendarType
  models.ChronicleAttendee:
    properties:
      guestCount:
        type: integer
      name:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/models.RsvpStatus'
        description: going / maybe
    type: object
  models.ChronicleEntry:
    properties:
      _id:
        type: string
      attendees:
        description: |-
          Attendees recorded as going/maybe, plus the total headcount
          (sum of 1 + guestCount over those attendees).
        items:
          $ref: '#/definitions/models.ChronicleAttendee'
        type: array
      capturedAt:
        type: integer
      description:
        type: string
      endDate:
        type: integer
      eventId:
        type: string
      headCount:
        type: integer
      location:
        type: string
      name:
        type: string
      shortId:
        description: to link back to the event
        type: string
      startDate:
        type: integer
    type: object
  models.Comment:
    properties:
      _id:
        type: string
      author:
        allOf:
        - $ref: '#/definitions/models.User'
        description: |-
          Author is the resolved account, attached per-request (never stored) so a
          client can render the author's avatar and nickname without a lookup per
          comment. Slimmed to identity fields — see attachCommentAuthors. Nil when
          the author is a guest row or a deleted account.
      authorName:
        description: |-
          Denormalized author display name, snapshotted at write time (a legacy
          guest's typed-in name, or the account's DisplayName()).

          The read path overwrites this with the author's CURRENT DisplayName when
          the account still resolves, so renaming propagates to old comments. The
          stored value stays as the fallback for the cases that never resolve:
          deleted accounts and legacy guest rows.
        type: string
      canManageThread:
        description: |-
          CanManageThread is computed per-request for the calling user (never stored):
          true when the caller may untag this root or flip its members-only flag.
        type: boolean
      createdAt:
        type: integer
      eventId:
        type: string
      isGuest:
        type: boolean
      isThread:
        description: |-
          IsThread marks this top-level comment as a thread root: it collapses in the
          UI and accepts replies. Only ever true on a comment with no ThreadId.
        type: boolean
      membersOnly:
        description: |-
          MembersOnly hides this thread and every reply in it from guests. Only
          meaningful on a thread root; replies inherit the root's setting rather than
          carrying their own.
        type: boolean
      mentions:
        description: |-
          Mentions are the accounts @mentioned in Text (F7), validated at write
          time: ids that don't resolve to an account, or that a guest author may
          not see on this event, are dropped here while the literal text stays.

          The tokens in Text are the source of truth for RENDERING; this field
          exists so the server can answer "who was notified" without re-parsing —
          specifically so an edit can diff against it and notify only the newly
          added (F8), and so mentions are queryable later.
        items:
          type: string
        type: array
      text:
        type: string
      threadId:
        description: ThreadId is the root comment this is a reply to. Nil for top-level
          comments.
        type: string
      updatedAt:
        description: set when edited
        type: integer
      userId:
        description: |-
          UserId is the author's user id hex. Legacy rows may instead hold a guest's
          typed-in name, with IsGuest true — the discussion is sign-in-only now, so
          no new guest rows are written, but old ones still render.
        type: string
    type: object
  models.Event:
    properties:
      _id:
        type: string
      blindAvailabilityEnabled:
        description: Whether to enable blind availability
        type: boolean
      calendarEventId:
        type: string
      chronicled:
        description: |-
          Whether this (non-recurring) gathering has been captured into the
          Chronicle (C10). Set once by the scheduler after the gathering ends so it
          isn't re-snapshotted. Recurring gatherings are captured per-occurrence at
          advance time instead and don't use this flag.
        type: boolean
      collectEmails:
        type: boolean
      comments:
        description: Discussion thread (fetched from the comments collection; not
          stored here)
        items:
          $ref: '#/definitions/models.Comment'
        type: array
      dates:
        items:
          type: integer
        type: array
      daysOnly:
        description: Whether to only poll for days, not times
        type: boolean
      description:
        type: string
      duration:
        type: number
      gatheringRecurrence:
        allOf:
        - $ref: '#/definitions/models.GatheringRecurrence'
        description: |-
          Recurrence config for a repeating gathering (C5, paired with ScheduledEvent).
          nil = a one-off gathering.
      gatheringReminder:
        allOf:
        - $ref: '#/definitions/models.GatheringReminder'
        description: Pre-gathering reminder email config/state (paired with ScheduledEvent)
      hasSpecificTimes:
        description: Used for specific times for specific dates feature
        type: boolean
      isArchived:
        type: boolean
      isDeleted:
        type: boolean
      lists:
        description: Shared lists (F13). Planner-created; anyone signed in adds items.
        items:
          $ref: '#/definitions/models.EventList'
        type: array
      location:
        description: |-
          Free-text venue/address for the gathering (C12). Surfaced on the event
          page, in the .ics LOCATION, and in the reminder email.
        type: string
      name:
        type: string
      notificationsEnabled:
        type: boolean
      numResponses:
        description: Used to store the number of responses for the event
        type: integer
      ownerId:
        type: string
      polls:
        description: |-
          Venue / activity polls (C6). Owner-created multiple-choice polls; votes
          live on each option.
        items:
          $ref: '#/definitions/models.Poll'
        type: array
      remindees:
        description: Remindees
        items:
          $ref: '#/definitions/models.Remindee'
        type: array
      responses:
        additionalProperties:
          $ref: '#/definitions/models.Response'
        description: Availability responses - old format for backward compatibility
          (fetched from eventResponses collection)
        type: object
      rsvps:
        additionalProperties:
          $ref: '#/definitions/models.Rsvp'
        description: RSVPs to the confirmed gathering, keyed by guest name / signed-in
          user id
        type: object
      scheduledEvent:
        allOf:
        - $ref: '#/definitions/models.CalendarEvent'
        description: Scheduled event (the confirmed gathering time, once the owner
          locks it in)
      sendEmailAfterXResponses:
        type: integer
      shortId:
        type: string
      startOnMonday:
        description: Whether to start the event on Monday (as opposed to Sunday, used
          for DOW events)
        type: boolean
      timeIncrement:
        type: integer
      times:
        items:
          type: integer
        type: array
      type:
        $ref: '#/definitions/models.EventType'
      when2meetHref:
        type: string
      wholeBlockSelection:
        description: |-
          When true (only meaningful with HasSpecificTimes), recipients must select
          an entire contiguous block of specific times at once, not individual slots.
        type: boolean
    type: object
  models.EventList:
    properties:
      _id:
        type: string
      items:
        items:
          $ref: '#/definitions/models.EventListItem'
        type: array
      kind:
        description: |-
          Kind is one of the ListKind constants, fixed when the list is created.
          A location list feeds its input through the Google address lookup and
          renders each item as a maps link; it stores the same plain string either
          way, matching Event.Location. A checklist gives every item a checkbox.
        type: string
      name:
        type: string
      virtual:
        description: |-
          Virtual marks a list that is DERIVED at read time rather than stored (N1).
          Today there is exactly one: the "Assigned" list that GET /my-lists
          synthesizes from the event's own checklist entries assigned to the caller.

          `bson:"-"`, like Rsvp.User — nothing writes this list, but the tag is what
          guarantees it, and a virtual list reaching a write path is a bug rather
          than a document to create. The client uses it to render the list read-only.
        type: boolean
    type: object
  models.EventListItem:
    properties:
      _id:
        type: string
      assigneeId:
        description: |-
          Who the entry is FOR (N1) — distinct from UserId, who wrote it, and from
          CheckedBy, who last ticked it. Meaningful only on a ListKindChecklist list.

          A POINTER for the reason ParentId is one: omitempty can't omit a [12]byte,
          so a zero id would serialize as 24 zeros and read back as a real member.
          AssigneeName is a DisplayName() snapshot re-resolved on read exactly like
          AuthorName and CheckedByName (routes/display_names.go).

          The pair is always written together, in both directions: unassigning $sets
          both to their zero value rather than $unset-ing them, which keeps the write
          inside db's existing setListItemFields.
        type: string
      assigneeName:
        type: string
      authorName:
        type: string
      checked:
        description: |-
          Checklist state, meaningful only on a ListKindChecklist list. All four are
          absent until someone first ticks the box, and from then on they are always
          written together — so Checked=false alongside a CheckedByName renders
          "Unchecked by Bart", while an item nobody has touched renders nothing.
          Only the last change is kept; there is deliberately no history.

          omitempty on the bool is safe because the write is a literal bson.M $set
          (struct tags don't apply to it), so an uncheck really does store false.
        type: boolean
      checkedAt:
        type: integer
      checkedBy:
        type: string
      checkedByName:
        type: string
      createdAt:
        type: integer
      order:
        description: |-
          Order places the item among its SIBLINGS — entries sharing its parentId
          compete only with each other. Fractional on purpose (see
          listItemOrderStep in routes/event_lists.go): a drop writes only the item
          that moved, which is what keeps db/event_lists.go's single-targeted-update
          invariant intact where integer reindexing would rewrite the whole group.

          NO omitempty on either tag, unlike everything around it. Two reasons: a
          drop at the top of a list legitimately computes 0, and omitempty would
          strip it back to "absent"; and absence is precisely how the F17 migration
          recognizes an item written before ordering existed. Items that predate the
          field decode to 0 and sort as a tie, which the display's stable
          array-position tie-break renders as today's insertion order.
        type: number
      parentId:
        description: |-
          ParentId is nil for a top-level item. A POINTER, not a bare ObjectID:
          omitempty can't omit a [12]byte array, so a zero id would serialize as 24
          zeros and read back as a real parent. Items written before nesting existed
          have no field at all, which decodes to nil — hence no migration.

          Set once, when the item is added. A move never points it at a NEW parent,
          only clears it (F17), so an item's depth can shrink but never grow — which
          is what keeps routes/event_lists.go's depth check exact.
        type: string
      sourceListId:
        description: |-
          Where this entry really lives, attached per-request (NEVER stored) when it
          is synthesized into the virtual "Assigned" list, so the client can write a
          tick back to the shared list it came from rather than to a private one.

          `bson:"-"` is load-bearing, not decoration: moveListItems $pushes whole
          EventListItem values, so an untagged field here would be persisted onto the
          real item the first time anyone dragged one between lists.
        type: string
      sourceListName:
        type: string
      text:
        type: string
      userId:
        type: string
    type: object
  models.EventType:
    enum:
    - specific_dates
    - dow
    type: string
    x-enum-varnames:
    - SPECIFIC_DATES
    - DOW
  models.Expense:
    properties:
      _id:
        type: string
      amountCents:
        type: integer
      canEdit:
        description: |-
          CanEdit is computed per-request for the calling user and never stored —
          the same idiom as Comment.CanManageThread. The client renders buttons from
          it; the server re-derives it on every write, so it is a hint, never a
          grant.
        type: boolean
      createdAt:
        type: integer
      createdBy:
        description: |-
          CreatedBy is the ownership key for editing ("members may edit their own
          entries"), and is deliberately NOT the same thing as PaidBy — one member
          may log an expense another fronted, and admins may log on anyone's behalf.
        type: string
      createdByName:
        type: string
      date:
        description: |-
          Date is the day the money was spent, which is not the day the row was
          created — you settle up on Sunday for a Friday you had already forgotten.
        type: integer
      description:
        type: string
      eventId:
        type: string
      history:
        description: History is the audit trail, append-only and oldest first.
        items:
          $ref: '#/definitions/models.ExpenseChange'
        type: array
      paidBy:
        description: |-
          PaidBy is who is owed. The names on this document are snapshots taken at
          write time and re-resolved on read (resolveExpenseNames), the same
          arrangement Comment.AuthorName uses: renaming propagates, but a deleted
          account still renders as the name it had.
        type: string
      paidByName:
        type: string
      receipts:
        items:
          $ref: '#/definitions/models.ExpenseReceiptRef'
        type: array
      splitMode:
        type: string
      splits:
        description: |-
          Splits always holds RESOLVED cents summing to exactly AmountCents,
          whichever mode produced them. Storing the resolution rather than the
          recipe is what lets the balance calculation be a plain sum with no
          knowledge of rounding rules, and what stops an even split silently
          re-dividing itself when someone is added to the gathering later.
        items:
          $ref: '#/definitions/models.ExpenseSplit'
        type: array
      title:
        type: string
      updatedAt:
        type: integer
    type: object
  models.ExpenseChange:
    properties:
      action:
        type: string
      at:
        type: integer
      byName:
        type: string
      byUser:
        type: string
      changes:
        description: |-
          Changes carries field-level diffs, and is present only on an "edited"
          entry. The values are PRE-FORMATTED display strings ("$142.50", "2 Aug
          2026", "Tom Foolery") rather than raw values, so rendering the trail needs
          no knowledge of what type each field happens to be — and so a historical
          entry keeps reading correctly even if the formatting rules change later.
        items:
          $ref: '#/definitions/models.ExpenseFieldChange'
        type: array
    type: object
  models.ExpenseFieldChange:
    properties:
      field:
        type: string
      from:
        type: string
      to:
        type: string
    type: object
  models.ExpenseReceiptRef:
    properties:
      _id:
        type: string
      contentType:
        type: string
      height:
        type: integer
      uploadedAt:
        type: integer
      uploadedBy:
        type: string
      width:
        type: integer
    type: object
  models.ExpenseSplit:
    properties:
      amountCents:
        type: integer
      name:
        type: string
      userId:
        type: string
    type: object
  models.Folder:
    properties:
      _id:
        type: string
      color:
        type: string
      defaultKind:
        type: string
      eventIds:
        items:
          type: string
        type: array
      isDefault:
        description: |-
          System "default" folders where events land automatically ("Invites
          created" / "Invites received"). IsDefault folders can't be deleted;
          DefaultKind is "created" or "received".
        type: boolean
      isDeleted:
        type: boolean
      name:
        type: string
      userId:
        type: string
    type: object
  models.GatheringRecurrence:
    properties:
      frequency:
        $ref: '#/definitions/models.RecurrenceFrequency'
      until:
        description: |-
          Until, when set, is the latest date an occurrence may START on; the series
          stops advancing once the next occurrence would fall after it. nil = no end.
        type: integer
    type: object
  models.GatheringReminder:
    properties:
      enabled:
        type: boolean
      leadTimeHours:
        type: integer
      sentAt:
        description: nil = not yet sent
        type: integer
      timezone:
        description: IANA tz for formatting the email time (e.g. "America/Los_Angeles")
        type: string
    type: object
  models.ICSCalendarAuth:
    properties:
      label:
        type: string
    type: object
  models.OAuth2CalendarAuth:
    type: object
  models.Poll:
    properties:
      _id:
        type: string
      allowMultiple:
        description: AllowMultiple lets a voter pick more than one option (else single-choice).
        type: boolean
      options:
        items:
          $ref: '#/definitions/models.PollOption'
        type: array
      title:
        type: string
    type: object
  models.PollOption:
    properties:
      _id:
        type: string
      label:
        type: string
      votes:
        additionalProperties:
          type: string
        description: |-
          Votes maps a responder key (guest name / signed-in user-id hex) to that
          voter's display name — so a count is len(Votes) and the roster is its values.
        type: object
    type: object
  models.RecurrenceFrequency:
    enum:
    - ""
    - weekly
    - biweekly
    - monthly
    type: string
    x-enum-varnames:
    - RecurrenceNone
    - RecurrenceWeekly
    - RecurrenceBiweekly
    - RecurrenceMonthly
  models.Remindee:
    properties:
      email:
        type: string
      responded:
        type: boolean
    type: object
  models.Response:
    properties:
      availability:
        description: Availability
        items:
          type: integer
        type: array
      calendarOptions:
        $ref: '#/definitions/models.CalendarOptions'
      email:
        type: string
      enabledCalendars:
        additionalProperties:
          items:
            type: string
          type: array
        description: Maps email to an array of sub calendar ids
        type: object
      ifNeeded:
        items:
          type: integer
        type: array
      manualAvailability:
        additionalProperties:
          items:
            type: integer
          type: array
        description: Mapping from the start date of a day to the available times for
          that day
        type: object
      name:
        description: Guest information
        type: string
      useCalendarAvailability:
        description: Calendar availability variables for Availability Groups feature
        type: boolean
      user:
        $ref: '#/definitions/models.User'
      userId:
        description: User information
        type: string
    type: object
  models.Role:
    enum:
    - superAdmin
    - admin
    - member
    - guest
    type: string
    x-enum-varnames:
    - RoleSuperAdmin
    - RoleAdmin
    - RoleMember
    - RoleGuest
  models.Rsvp:
    properties:
      email:
        type: string
      guestCount:
        description: |-
          GuestCount is the number of ADDITIONAL people this responder is bringing
          (a spouse/plus-one), i.e. the headcount for this RSVP is 1 + GuestCount.
          Only meaningful for going/maybe.
        type: integer
      name:
        type: string
      respondedAt:
        type: integer
      status:
        $ref: '#/definitions/models.RsvpStatus'
      user:
        allOf:
        - $ref: '#/definitions/models.User'
        description: |-
          User is the resolved account, attached per-request (never stored) so the
          roster can render an avatar without a lookup per RSVP — the same shape
          Comment.Author uses. Slimmed to identity fields; see resolveRsvpNames.
          Nil for a legacy name-keyed row or a deleted account.

          `bson:"-"` is load-bearing: the RSVP write path $sets the whole rsvps map
          from the in-memory struct, so an untagged field would be persisted.
      userId:
        type: string
    type: object
  models.RsvpStatus:
    enum:
    - going
    - maybe
    - "no"
    type: string
    x-enum-varnames:
    - RsvpGoing
    - RsvpMaybe
    - RsvpNo
  models.SubCalendar:
    properties:
      enabled:
        type: boolean
      name:
        type: string
    type: object
  models.User:
    properties:
      _id:
        description: Profile info
        type: string
      avatarUpdatedAt:
        description: |-
          AvatarUpdatedAt is set when the user uploads a profile photo and unset
          when they remove it, so it serves as both the has-an-avatar flag and the
          cache-buster on the (immutably cached) /users/:userId/avatar URL. The
          bytes themselves live in the avatars collection — see models/avatar.go.

          A pointer because absent must be distinguishable from the zero time: the
          UI shows the uploaded photo only when this is non-nil, otherwise it falls
          back to the Google `picture` URL and then to a monogram.
        type: integer
      calendarAccounts:
        additionalProperties:
          $ref: '#/definitions/models.CalendarAccount'
        description: |-
          CalendarAccounts is a mapping from {`email_CALENDARTYPE` => CalendarAccount} that contains all the
          additional accounts the user wants to see google calendar events for
        type: object
      calendarOptions:
        allOf:
        - $ref: '#/definitions/models.CalendarOptions'
        description: Calendar options
      email:
        type: string
      firstName:
        type: string
      hasCustomName:
        description: Whether the user has set a custom name for themselves, i.e. don't
          change their name when they sign in
        type: boolean
      lastName:
        type: string
      nickname:
        description: |-
          Nickname is what the club actually calls this person. When set it stands
          in for the name everywhere it is displayed — see DisplayName. The real
          name is kept, not replaced, so the roll and the directory can still show
          both.
        type: string
      phone:
        type: string
      picture:
        type: string
      primaryAccountKey:
        description: The calendarAccountKey of the account the user first signed in
          with
        type: string
      role:
        allOf:
        - $ref: '#/definitions/models.Role'
        description: |-
          Role is the user's access level in the invite-only Fellowship
          (superAdmin/admin/member/guest). Empty ⇒ treated as member. See roles.go.
      timezoneOffset:
        type: integer
    type: object
  models.WorkingHoursOptions:
    properties:
      enabled:
        type: boolean
      endTime:
        type: number
      startTime:
        type: number
    type: object
  responses.Error:
    properties:
      error: {}
    required:
    - error
    type: object
  responses.Health:
    properties:
      mongo:
        type: string
      status:
        type: string
      version:
        type: string
    type: object
  responses.SearchContacts:
    properties:
      contacts:
        items:
          $ref: '#/definitions/models.User'
        type: array
      hasContactsAccess:
        type: boolean
    type: object
  routes.CreateFolderResponse:
    properties:
      id:
        type: string
    type: object
  routes.allowlistMember:
    properties:
      _id:
        type: string
      addedAt:
        type: integer
      addedBy:
        type: string
      avatarUpdatedAt:
        description: |-
          AvatarUpdatedAt lets the roll render uploaded photos the same way every
          other surface does — present means "has one", and its value is the
          cache-buster for the serving URL.
        type: integer
      email:
        type: string
      firstName:
        type: string
      hasAccount:
        type: boolean
      lastName:
        type: string
      nickname:
        type: string
      phone:
        type: string
      role:
        $ref: '#/definitions/models.Role'
      userId:
        description: |-
          UserId is empty for an invitation nobody has claimed yet. The roll needs
          it to address a specific account — avatars, and the admin edit that F6
          adds — where the email alone won't do.

          A hex string, not an ObjectID: `omitempty` cannot omit an ObjectID (it is
          a [12]byte array, which encoding/json never considers empty), so an
          unclaimed invitation would ship a zero id that reads as real.
        type: string
    type: object
  routes.personalNoteResponse:
    properties:
      text:
        type: string
      updatedAt:
        description: |-
          A POINTER so an unwritten note serializes as null rather than as the
          epoch, which would render as "Saved 01:00" on a note nobody has saved.
        type: integer
    type: object
host: localhost:3002/api
info:
  contact: {}
  description: This is the API for The Fellowship!
  title: The Fellowship API
  version: "1.0"
paths:
  /admin/allowlist:
    delete:
      consumes:
      - application/json
      parameters:
      - description: Email to remove
        in: body
        name: payload
        required: true
        schema:
          properties:
            email:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Removes an email from the allowlist
      tags:
      - admin
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/routes.allowlistMember'
            type: array
      summary: Lists the invite-only allowlist (with member status + role)
      tags:
      - admin
    post:
      consumes:
      - application/json
      parameters:
      - description: Email to invite and the role to grant
        in: body
        name: payload
        required: true
        schema:
          properties:
            email:
              type: string
            role:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Adds an email to the allowlist (invite a member)
      tags:
      - admin
  /admin/member/avatar:
    delete:
      consumes:
      - application/json
      description: Admin-only. Idempotent — removing a photo that isn't there succeeds.
      parameters:
      - description: Target email
        in: body
        name: payload
        required: true
        schema:
          properties:
            email:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: user-does-not-exist
          schema:
            $ref: '#/definitions/responses.Error'
        "403":
          description: not-authorized / super-admin-immutable
          schema:
            $ref: '#/definitions/responses.Error'
      summary: Removes another member's profile photo (admin only)
      tags:
      - admin
    put:
      consumes:
      - application/json
      description: |-
        Admin-only. Runs the identical pipeline as the self-serve route:
        centre-cropped, downscaled to 256x256, re-encoded as JPEG.
      parameters:
      - description: Target email and a data URL of the image
        in: body
        name: payload
        required: true
        schema:
          properties:
            email:
              type: string
            image:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              avatarUpdatedAt:
                type: integer
            type: object
        "400":
          description: invalid-image / user-does-not-exist
          schema:
            $ref: '#/definitions/responses.Error'
        "403":
          description: not-authorized / super-admin-immutable
          schema:
            $ref: '#/definitions/responses.Error'
        "413":
          description: image-too-large
          schema:
            $ref: '#/definitions/responses.Error'
      summary: Sets another member's profile photo (admin only)
      tags:
      - admin
  /admin/member/profile:
    patch:
      consumes:
      - application/json
      description: |-
        Admin-only. Fields are optional: omitting one leaves it unchanged.
        Sending an empty nickname clears it. Super admins cannot be edited,
        and the target must already have an account (an unclaimed invitation
        has nothing to edit).
      parameters:
      - description: Target email plus the fields to change
        in: body
        name: payload
        required: true
        schema:
          properties:
            email:
              type: string
            firstName:
              type: string
            lastName:
              type: string
            nickname:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              email:
                type: string
              firstName:
                type: string
              lastName:
                type: string
              nickname:
                type: string
            type: object
        "400":
          description: user-does-not-exist
          schema:
            $ref: '#/definitions/responses.Error'
        "403":
          description: not-authorized / super-admin-immutable
          schema:
            $ref: '#/definitions/responses.Error'
      summary: Updates another member's name and/or nickname (admin only)
      tags:
      - admin
  /admin/member/role:
    post:
      consumes:
      - application/json
      parameters:
      - description: Member email and new role
        in: body
        name: payload
        required: true
        schema:
          properties:
            email:
              type: string
            role:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Sets a member's role (guest/member/admin)
      tags:
      - admin
  /auth/otp/check-email:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email to check
        in: body
        name: payload
        required: true
        schema:
          properties:
            email:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Checks whether a user with the given email exists
      tags:
      - auth
  /auth/otp/send:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email to send OTP to
        in: body
        name: payload
        required: true
        schema:
          properties:
            email:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Sends an OTP code to the given email
      tags:
      - auth
  /auth/otp/verify:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email, OTP code, and timezone offset
        in: body
        name: payload
        required: true
        schema:
          properties:
            code:
              type: string
            email:
              type: string
            timezoneOffset:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Verifies an OTP code and signs the user in
      tags:
      - auth
  /auth/sign-in:
    post:
      consumes:
      - application/json
      description: Signs user in and sets the access token session variable
      parameters:
      - description: Object containing the Google authorization code, scope, calendar
          type, and the user's timezone offset
        in: body
        name: payload
        required: true
        schema:
          properties:
            calendarType:
              type: string
            code:
              type: string
            scope:
              type: string
            timezoneOffset:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Signs user in
      tags:
      - auth
  /auth/sign-in-mobile:
    post:
      consumes:
      - application/json
      description: Signs user in and sets the access token session variable
      parameters:
      - description: Object containing the Google authorization code, calendar type,
          and the user's timezone offset
        in: body
        name: payload
        required: true
        schema:
          properties:
            accessToken:
              type: string
            calendarType:
              type: string
            expiresIn:
              type: integer
            idToken:
              type: string
            refreshToken:
              type: string
            scope:
              type: string
            timezoneOffset:
              type: integer
            tokenOrigin:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Signs user in from mobile
      tags:
      - auth
  /auth/sign-out:
    post:
      consumes:
      - application/json
      description: Signs user out and deletes the session
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Signs user out
      tags:
      - auth
  /auth/status:
    get:
      description: Returns a 401 error if user is not signed in, 200 if they are
      responses:
        "200":
          description: OK
        "401":
          description: Error object
          schema:
            $ref: '#/definitions/responses.Error'
      summary: Gets whether the user is signed in or not
      tags:
      - auth
  /chronicle:
    get:
      description: Members-only, read-only archive of gatherings that have taken place,
        most recent first. Auto-captured when a confirmed gathering's time passes.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ChronicleEntry'
            type: array
      summary: Lists past gatherings (The Chronicle)
      tags:
      - chronicle
  /events:
    post:
      consumes:
      - application/json
      parameters:
      - description: Object containing info about the event to create
        in: body
        name: payload
        required: true
        schema:
          properties:
            blindAvailabilityEnabled:
              type: boolean
            dates:
              items:
                type: string
              type: array
            daysOnly:
              type: boolean
            duration:
              type: number
            name:
              type: string
            notificationsEnabled:
              type: boolean
            remindees:
              items:
                type: string
              type: array
            sendEmailAfterXResponses:
              type: integer
            timeIncrement:
              type: integer
            type:
              $ref: '#/definitions/models.EventType'
            when2meetHref:
              type: string
            wholeBlockSelection:
              type: boolean
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            properties:
              eventId:
                type: string
            type: object
      summary: Creates a new event
      tags:
      - events
  /events/{eventId}:
    delete:
      parameters:
      - description: Event ID
        in: path
        name: eventId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Deletes an event based on its id
      tags:
      - events
    get:
      parameters:
      - description: Event ID
        in: path
        name: eventId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Event'
      summary: Gets an event based on its id
      tags:
      - events
    put:
      parameters:
      - description: Event ID
        in: path
        name: eventId
        required: true
        type: string
      - description: Object containing info about the event to update
        in: body
        name: payload
        required: true
        schema:
          properties:
            blindAvailabilityEnabled:
              type: boolean
            dates:
              items:
                type: string
              type: array
            daysOnly:
              type: boolean
            description:
              type: string
            duration:
              type: number
            name:
              type: string
            notificationsEnabled:
              type: boolean
            remindees:
              items:
                type: string
              type: array
            sendEmailAfterXResponses:
              type: integer
            type:
              $ref: '#/definitions/models.EventType'
            wholeBlockSelection:
              type: boolean
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Edits an event based on its id
      tags:
      - events
  /events/{eventId}/archive:
    post:
      consumes:
      - application/json
      parameters:
      - description: Event ID
        in: path
        name: eventId
        required: true
        type: string
      - description: Archive status
        in: body
        name: payload
        required: true
        schema:
          properties:
            archive:
              type: boolean
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Archive an event
      tags:
      - events
  /events/{eventId}/comments:
    post:
      consumes:
      - application/json
      parameters:
      - description: Event ID
        in: path
        name: eventId
        required: true
        type: string
      - description: Comment text, plus the thread root to reply under
        in: body
        name: payload
        required: true
        schema:
          properties:
            text:
              type: string
            threadId:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Comment'
      summary: Posts a comment to an event's discussion, optionally as a thread reply
      tags:
      - events
  /events/{eventId}/comments/{commentId}:
    delete:
      consumes:
      - application/json
      description: Deleting a thread root also deletes every reply within it.
      parameters:
      - description: Event ID
        in: path
        name: eventId
        required: true
        type: string
      - description: Comment ID
        in: path
        name: commentId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Deletes a comment (own, or any when the caller is the event owner)
      tags:
      - events
    put:
      consumes:
      - application/json
      parameters:
      - description: Event ID
        in: path
        name: eventId
        required: true
        type: string
      - description: Comment ID
        in: path
        name: commentId
        required: true
        type: string
      - description: New text
        in: body
        name: payload
        required: true
        schema:
          properties:
            text:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Edits the caller's own comment
      tags:
      - events
  /events/{eventId}/comments/{commentId}/thread:
    delete:
      consumes:
      - application/json
      description: Only possible while the thread has no replies — un-tagging a thread
        with replies would scatter them into the top-level discussion out of context.
      parameters:
      - description: Event ID
        in: path
        name: eventId
        required: true
        type: string
      - description: Comment ID
        in: path
        name: commentId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "409":
          description: thread-has-replies
          schema:
            $ref: '#/definitions/responses.Error'
      summary: Un-tags a thread, returning it to an ordinary comment
      tags:
      - events
    patch:
      consumes:
      - application/json
      parameters:
      - description: Event ID
        in: path
        name: eventId
        required: true
        type: string
      - description: Comment ID
        in: path
        name: commentId
        required: true
        type: string
      - description: New members-only setting
        in: body
        name: payload
        required: true
        schema:
          properties:
            membersOnly:
              type: boolean
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Toggles whether a thread is members-only
      tags:
      - events
    post:
      consumes:
      - application/json
      description: Members and admins may promote a top-level comment to a thread,
        optionally hiding it from guests. Replies then hang off it.
      parameters:
      - description: Event ID
        in: path
        name: eventId
        required: true
        type: string
      - description: Comment ID
        in: path
        name: commentId
        required: true
        type: string
      - description: Whether the thread is hidden from guests
        in: body
        name: payload
        required: true
        schema:
          properties:
            membersOnly:
              type: boolean
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Tags a comment as a discussion thread
      tags:
      - events
  /events/{eventId}/duplicate:
    post:
      parameters:
      - description: Event ID
        in: path
        name: eventId
        required: true
        type: string
      - description: Object containing options for the duplicated event
        in: body
        name: payload
        required: true
        schema:
          properties:
            copyAvailability:
              type: boolean
            eventName:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Duplicate event
      tags:
      - events
  /events/{eventId}/expenses:
    get:
      description: Readable by anyone signed in who can see the gathering, guests
        included. Each row carries a computed `canEdit` for the calling user.
      parameters:
      - description: Event ID
        in: path
        name: eventId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Expense'
            type: array
      summary: Lists a gathering's expenses, newest first
      tags:
      - events
    post:
      consumes:
      - application/json
      description: 'Members and up only. The server resolves the split itself: an
        even split is computed from the participant list, and a by-amount split must
        sum to the total exactly.'
      parameters:
      - description: Event ID
        in: path
        name: eventId
        required: true
        type: string
      - description: The expense
        in: body
        name: payload
        required: true
        schema:
          properties:
            amountCents:
              type: integer
            date:
              type: integer
            description:
              type: string
            paidBy:
              type: string
            participants:
              items:
                type: string
              type: array
            splitMode:
              type: string
            splits:
              items:
                type: object
              type: array
            title:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Expense'
        "400":
          description: invalid-amount / invalid-title / split-mismatch / no-participants
            / not-a-participant
          schema:
            $ref: '#/definitions/responses.Error'
      summary: Adds an expense to a gathering's ledger
      tags:
      - events
  /events/{eventId}/expenses/{expenseId}:
    delete:
      description: Soft delete — the row leaves the ledger and the balances, but its
        change history is retained. The member who entered it, or any admin.
      parameters:
      - description: Event ID
        in: path
        name: eventId
        required: true
        type: string
      - description: Expense ID
        in: path
        name: expenseId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "403":
          description: not-authorized
          schema:
            $ref: '#/definitions/responses.Error'
      summary: Deletes an expense
      tags:
      - events
    put:
      consumes:
      - application/json
      description: The member who entered it, or any admin. An edit that changes nothing
        is refused rather than recorded, so the change history stays a record of real
        changes.
      parameters:
      - description: Event ID
        in: path
        name: eventId
        required: true
        type: string
      - description: Expense ID
        in: path
        name: expenseId
        required: true
        type: string
      - description: The expense
        in: body
        name: payload
        required: true
        schema:
          properties:
            amountCents:
              type: integer
            date:
              type: integer
            description:
              type: string
            paidBy:
              type: string
            participants:
              items:
                type: string
              type: array
            splitMode:
              type: string
            splits:
              items:
                type: object
              type: array
            title:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: invalid-amount / invalid-title / split-mismatch / no-changes
          schema:
            $ref: '#/definitions/responses.Error'
        "403":
          description: not-authorized
          schema:
            $ref: '#/definitions/responses.Error'
      summary: Edits an expense
      tags:
      - events
  /events/{eventId}/expenses/{expenseId}/receipts:
    post:
      consumes:
      - application/json
      description: Accepts a base64 data URL (JPEG or PNG). The image is downscaled
        to a 2000px long edge and re-encoded as JPEG before storage, so EXIF metadata
        — including the GPS tag on a phone photo — is discarded. The member who entered
        the expense, or any admin.
      parameters:
      - description: Event ID
        in: path
        name: eventId
        required: true
        type: string
      - description: Expense ID
        in: path
        name: expenseId
        required: true
        type: string
      - description: Data URL of the image to store
        in: body
        name: payload
        required: true
        schema:
          properties:
            image:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ExpenseReceiptRef'
        "400":
          description: invalid-image
          schema:
            $ref: '#/definitions/responses.Error'
        "413":
          description: image-too-large / too-many-receipts
          schema:
            $ref: '#/definitions/responses.Error'
      summary: Attaches a receipt photo to an expense
      tags:
      - events
  /events/{eventId}/expenses/{expenseId}/receipts/{receiptId}:
    delete:
      description: The member who entered the expense, or any admin.
      parameters:
      - description: Event ID
        in: path
        name: eventId
        required: true
        type: string
      - description: Expense ID
        in: path
        name: expenseId
        required: true
        type: string
      - description: Receipt ID
        in: path
        name: receiptId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "403":
          description: not-authorized
          schema:
            $ref: '#/definitions/responses.Error'
      summary: Removes a receipt photo from an expense
      tags:
      - events
    get:
      description: Readable by anyone signed in who can see the gathering, guests
        included — the ledger is theirs to read too.
      parameters:
      - description: Event ID
        in: path
        name: eventId
        required: true
        type: string
      - description: Expense ID
        in: path
        name: expenseId
        required: true
        type: string
      - description: Receipt ID
        in: path
        name: receiptId
        required: true
        type: string
      produces:
      - image/jpeg
      responses:
        "200":
          description: OK
        "404":
          description: receipt-not-found
          schema:
            $ref: '#/definitions/responses.Error'
      summary: Serves a receipt photo
      tags:
      - events
  /events/{eventId}/expenses/participants:
    get:
      description: Everyone who took part in this gathering and is a member or above,
        plus the caller. Guests are excluded — they read the ledger but never share
        an expense — and are refused this endpoint outright.
      parameters:
      - description: Event ID
        in: path
        name: eventId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.User'
            type: array
      summary: Lists the members an expense may be split between
      tags:
      - events
  /events/{eventId}/ics:
    get:
      description: Universal "add to calendar" — returns a text/calendar file for
        the gathering's locked-in time. No auth required so any invitee (incl. members
        without a Google account) can add it. 404 if the event has no confirmed gathering
        yet.
      parameters:
      - description: Event ID
        in: path
        name: eventId
        required: true
        type: string
      produces:
      - text/calendar
      responses:
        "200":
          description: OK
      summary: Downloads an .ics calendar file for the event's confirmed gathering
      tags:
      - events
  /events/{eventId}/ids:
    get:
      parameters:
      - description: Event shortId or longId
        in: path
        name: eventId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              longId:
                type: string
              shortId:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.Error'
      summary: Resolves an event identifier to both short and long IDs
      tags:
      - events
  /events/{eventId}/lists:
    get:
      consumes:
      - application/json
      description: 'The cheap refresh: getEvent resolves a user per availability response
        and per sign-up response before it ever reaches the lists, which is far too
        much work to see one new entry appear.'
