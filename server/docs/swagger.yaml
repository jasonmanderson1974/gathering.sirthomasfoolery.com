  /users/{userId}/avatar:
    get:
      description: |-
        Requires a signed-in session — member photos are club data, not public.
        Cached immutably: the URL is expected to carry the account's
        avatarUpdatedAt as a `?v=` parameter, so a new upload is a new URL.
        An ETag is sent as well, for clients that revalidate anyway.
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: string
      produces:
      - image/jpeg
      responses:
        "200":
          description: The user's avatar
          schema:
            type: file
        "401":
          description: Not signed in
          schema:
            $ref: '#/definitions/responses.Error'
        "404":
          description: The user has no uploaded avatar
          schema:
            $ref: '#/definitions/responses.Error'
      summary: Serves a user's uploaded profile photo
      tags:
      - users
