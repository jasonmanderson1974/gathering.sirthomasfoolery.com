<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="192x192" href="<%= BASE_URL %>favicon-192x192.png?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="<%= BASE_URL %>favicon-32x32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="<%= BASE_URL %>favicon-16x16.png?v=3" />
    <link rel="icon" href="<%= BASE_URL %>favicon.ico?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="<%= BASE_URL %>apple-touch-icon.png?v=3" />
    <!-- Installable to the home screen, which on iOS is also what lets a tab
         live long enough for offline reading to be worth anything — Safari
         evicts ordinary backgrounded tabs aggressively.

         Written by hand rather than injected by @vue/cli-plugin-pwa, because
         this file is templated TWICE — by lodash at build time and by Go's
         html/template at serve time — and a plugin that rewrites it is a
         plugin that can mangle the Go half.

         NOTE FOR ANYONE EDITING THIS FILE, including in comments: BOTH
         template syntaxes are live in here, and neither engine skips HTML
         comments. An empty lodash interpolation fails the build with a bare
         "SyntaxError: Unexpected token ')'" that names no file, and an empty
         Go action fails at serve time instead. Write the delimiters out in
         words, as this comment does, or don't mention them. -->
    <link rel="manifest" href="<%= BASE_URL %>manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="The Fellowship" />
    <!-- Chrome, Firefox OS and Opera -->
    <meta name="theme-color" content="#1c1410" />
    <!-- Windows Phone -->
    <meta name="msapplication-navbutton-color" content="#1c1410" />
    <!-- iOS Safari -->
    <meta name="apple-mobile-web-app-status-bar-style" content="#1c1410" />
    <div style="display:none">
    {{ $defaultTitle := "The Fellowship · The Gathering" }}
    {{ $defaultDescription := "The Fellowship's private hall for calling a Gathering — cast thy vote, good sir, and settle upon the hour that suits the whole Order." }}
    {{ $defaultOgImage := "/img/ogImage.png" }}
    </div>
    <title>{{ or .title $defaultTitle }}</title>
    <meta
      name="description"
      content="{{or .description $defaultDescription }}"
    />
    <meta property="og:title" content="{{or .ogTitle $defaultTitle}}" />
    <meta property="og:description" content="{{or .ogDescription $defaultDescription }}" />
    <meta property="og:image" content="{{or .ogImage $defaultOgImage }}" />
    <meta property="og:image:secure_url" content="{{or .ogImage $defaultOgImage }}" />
    <!-- NO FONT <link>s HERE, DELIBERATELY (L9). Every face this app uses — the
         MDI icon webfont and the four text faces (DM Sans, Cinzel, Cormorant
         Garamond, EB Garamond) — is bundled from a pinned npm package and
         imported in src/main.js, so it is emitted by webpack as a
         content-hashed, same-origin asset.

         This used to hold a preconnect pair and two stylesheet <link>s to
         fonts.googleapis.com. That blocked first paint on a third party and
         sent every member's IP and User-Agent to Google on every page load of
         an invite-only club. Don't add one back for a new face: add the
         package instead. -->
  </head>
  <body>
    <noscript>
      <strong
        >We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work
        properly without JavaScript enabled. Please enable it to
        continue.</strong
      >
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
