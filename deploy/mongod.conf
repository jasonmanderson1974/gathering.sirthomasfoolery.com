# MongoDB config for stf-thegathering.
#
# Installed by deploy/install.sh over the packaged default. Two departures from
# that default matter:
#
#   - authorization is enabled. The packaged default ships auth OFF, which is
#     survivable only while bindIp is loopback — and relies on that staying true
#     forever. Both belts, please.
#   - the WiredTiger cache is pinned. Left alone, Mongo takes half of (RAM - 1G)
#     for itself, which on a small host crowds out the app for a dataset
#     measured in megabytes.

storage:
  dbPath: /var/lib/mongodb
  wiredTiger:
    engineConfig:
      # Generous for a database of this size; revisit if avatars grow it by
      # orders of magnitude.
      cacheSizeGB: 0.5

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

net:
  port: 27017
  # Loopback only. The app is the sole client and runs on this host. Nothing in
  # the Sir Tom VLAN should be able to reach the database directly; if that ever
  # changes, it needs TLS and a considered decision, not a wider bindIp.
  bindIp: 127.0.0.1

security:
  authorization: enabled

processManagement:
  timeZoneInfo: /usr/share/zoneinfo
