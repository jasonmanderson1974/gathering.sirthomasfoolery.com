name: timeful-dev

# Local development / smoke-test stack. Self-contained — no real secrets needed:
#   docker compose -f compose.dev.yaml up -d --build
#   open http://localhost:3002
#
# Boots the full app against a throwaway local Mongo (exposed on :27017 so the
# Go test suite can run against it too). NOTE: auth flows that need external
# services do NOT work locally — Gmail SMTP (email OTP codes) and Google OAuth
# (calendar) are not configured here. Use this for build/boot/UI smoke tests and
# for running the backend integration tests, not for full login flows.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      # Exposed so `go test ./db/ ./routes/` on the host can reach it. The port
      # is a variable only so a second copy of this stack can run beside your
      # dev one without a collision — see scripts/browser-check.sh, which brings
      # up its own throwaway project. Leave it alone and you get 27017.
      - "${DEV_MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_dev_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      target: builder
      args:
        VUE_APP_GOOGLE_CLIENT_ID: "" # Google calendar disabled locally (login is OTP-only)
        # Address lookup. Must come through as a build arg: the Dockerfile always
        # sets this ENV, and dotenv won't overwrite an already-set variable, so a
        # key in frontend/.env is ignored inside the image. Set GOOGLE_MAPS_API_KEY
        # in the (gitignored) root .env; unset just means plain text fields.
        VUE_APP_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    volumes:
      - frontend_dev_dist:/app/dist
    command:
      [
        "sh",
        "-c",
        "rm -rf /app/dist/* && cp -r /build/* /app/dist/ && echo 'Frontend assets copied' && tail -f /dev/null",
      ]

  server:
    build:
      context: ./server
    restart: unless-stopped
    ports:
      - "${DEV_HTTP_PORT:-3002}:3002" # see the note on the mongo port above
    environment:
      MONGODB_URI: mongodb://mongo:27017
      GIN_MODE: debug
      # Dummy dev secrets — NOT for production. SESSION_SECRET must be >=32 chars;
      # ENCRYPTION_KEY is used raw as an AES key (32 chars => AES-256).
      #
      # Written as `${VAR:-dummy}` rather than a bare literal so a real value can
      # actually win. An `environment:` entry beats every `env_file:`, so the
      # secrets overlay pointing at server/.env.dev.local could never override a
      # hardcoded value here — it silently ran on the dummy key instead, which
      # meant no encrypted field from a restored production dump would decrypt
      # (calendar tokens are the ones you notice: /api/user/profile 500s with
      # "cipher: message authentication failed").
      #
      # To use the real ones, source the file first — see compose.dev.secrets.yaml:
      #   set -a; . server/.env.dev.local; set +a
      SESSION_SECRET: "${SESSION_SECRET:-dev-session-secret-not-for-prod-change-me!!}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}"
      # Google OAuth. Empty by default, which disables calendar linking; set them
      # to exercise the calendar path against a real account. CLIENT_ID is picked
      # up from the root .env automatically (Compose loads it for interpolation);
      # CLIENT_SECRET has to come from the sourced file above.
      CLIENT_ID: "${CLIENT_ID:-}"
      CLIENT_SECRET: "${CLIENT_SECRET:-}"
      CORS_ORIGINS: "http://localhost:8080"
      # Invite-only gate off locally so an empty allowlist fails open for testing.
      INVITE_ONLY_ENFORCED: "false"
    volumes:
      - frontend_dev_dist:/app/frontend/dist:ro
    depends_on:
      mongo:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  mongo_dev_data:
  frontend_dev_dist:
