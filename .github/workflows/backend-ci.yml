name: Backend CI

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    # Ephemeral Mongo for the db integration tests (./db). Health-gated so the
    # test step doesn't start until it's ready.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: server/go.sum

      # Compiles the whole server (main package + all its imports). The one-off
      # migration scripts under server/scripts are standalone main packages that
      # aren't imported, so this doesn't touch them (they reference outdated
      # models and don't compile — see reference-vm-go-test).
      - name: Compile server
        run: go build .

      # go vet is BLOCKING (backlog cleared 2026-07-22, TODO A8). scripts/ are
      # excluded everywhere because they don't compile.
      - name: go vet
        run: go vet $(go list ./... | grep -v '/scripts')

      # BLOCKING since 2026-07-28 (TODO B5): the backlog is at zero, so anything
      # this reports is new. Fix it or suppress it with a reason, as
      # utils/utils.go does for the CFB deprecation — don't reintroduce
      # continue-on-error.
      #
      # NOTE the `-f '{{.Dir}}'`: golangci-lint takes DIRECTORIES, and plain
      # `go list` emits import paths. Passing those made it resolve every
      # package against the wrong root, report "typechecking error: directory
      # not found", and then cheerfully print "0 issues" — so this step linted
      # nothing at all until 2026-07-28. Whatever else changes here, keep the
      # arguments as paths.
      - name: golangci-lint
        run: |
          curl -sL https://github.com/golangci/golangci-lint/releases/download/v2.12.2/golangci-lint-2.12.2-linux-amd64.tar.gz | tar xz -C /tmp
          /tmp/golangci-lint-2.12.2-linux-amd64/golangci-lint run $(go list -f '{{.Dir}}' ./... | grep -v '/scripts')

      # `.` is the main package — config parsing (CORS origins, secret/key
      # validation), no server boot. models/routes/utils need no external
      # services; db and services/reminders run integration tests against the
      # Mongo service above (they skip when MONGODB_URI is unset). services/auth,
      # services/calendar, services/contacts and services/microsoftgraph hold
      # pure-logic tests (OAuth token-response decoding, ICS generation, contact
      # formatting, Graph parsing) — the *packages* talk to external APIs, but
      # their tests stub the transport, so they belong here. Any package without
      # tests is simply omitted.
      - name: Run tests
        env:
          MONGODB_URI: mongodb://localhost:27017
        run: go test . ./models/ ./routes/ ./utils/ ./db/ ./encryption/ ./services/auth/ ./services/reminders/ ./services/calendar/ ./services/contacts/ ./services/microsoftgraph/
