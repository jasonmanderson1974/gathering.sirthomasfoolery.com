name: Backend CI

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    # Ephemeral Mongo for the db integration tests (./db). Health-gated so the
    # test step doesn't start until it's ready.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Matches the build box and dependency-audit.yml. go.mod's `go 1.25.0`
          # stays as it is: that is the LANGUAGE level, not the toolchain, and
          # lowering the toolchain to match it would put CI on a standard
          # library production never runs.
          go-version: "1.26"
          cache-dependency-path: server/go.sum

      # Compiles the whole server (main package + all its imports). The one-off
      # migration scripts under server/scripts are standalone main packages that
      # aren't imported, so this doesn't touch them (they reference outdated
      # models and don't compile — see reference-vm-go-test).
      - name: Compile server
        run: go build .

      # go vet is BLOCKING (backlog cleared 2026-07-22, TODO A8). scripts/ are
      # excluded everywhere because they don't compile.
      - name: go vet
        run: go vet $(go list ./... | grep -v '/scripts')

      # BLOCKING since 2026-07-28 (TODO B5): the backlog is at zero, so anything
      # this reports is new. Fix it, or suppress it narrowly with a reason
      # (`//nolint:<linter> // why`) — don't reintroduce continue-on-error. The
      # tree currently carries no nolint directives at all; the last one, on the
      # AES-CFB deprecation in utils/utils.go, went away with B6.
      #
      # NOTE the `-f '{{.Dir}}'`: golangci-lint takes DIRECTORIES, and plain
      # `go list` emits import paths. Passing those made it resolve every
      # package against the wrong root, report "typechecking error: directory
      # not found", and then cheerfully print "0 issues" — so this step linted
      # nothing at all until 2026-07-28. Whatever else changes here, keep the
      # arguments as paths.
      - name: golangci-lint
        run: |
          curl -sL https://github.com/golangci/golangci-lint/releases/download/v2.12.2/golangci-lint-2.12.2-linux-amd64.tar.gz | tar xz -C /tmp
          /tmp/golangci-lint-2.12.2-linux-amd64/golangci-lint run $(go list -f '{{.Dir}}' ./... | grep -v '/scripts')

      # Derived, not enumerated — same `go list | grep -v '/scripts'` shape as
      # the two steps above (TODO E12). This used to be a hand-written package
      # list, and it drifted three times in two days: B4 found it skipping three
      # test files, B8 found services/auth missing, E10 found `.` missing. A
      # spelled-out list is also wrong by construction — it names the packages
      # that have tests *today*, so a new package's tests run nowhere until
      # someone remembers to add it. Deriving it makes that impossible.
      #
      # Packages with no test files report "[no test files]" and pass. The
      # DB-backed tests (db, routes, services/reminders) use requireDB and skip
      # when MONGODB_URI is unset, so the same command works on a machine
      # without Mongo.
      - name: Run tests
        env:
          MONGODB_URI: mongodb://localhost:27017
        run: go test $(go list ./... | grep -v '/scripts')
