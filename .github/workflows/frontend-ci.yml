name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Lint is FULLY BLOCKING (warning backlog cleared 2026-07-29, TODO2 H4):
      # the rules sit at `error`, and `--max-warnings 0` in the lint script
      # means a new warning fails the build too. Deliberate exceptions carry an
      # `eslint-disable` comment stating why — see frontend/.eslintrc.cjs.
      - name: Lint
        run: npm run lint

      # Vue 3 turns an unrecognised prop into a DOM attribute without a word, so
      # a Vuetify 2 prop that no longer exists survives lint, the unit suite and
      # the build (TODO3 L2/L3). This diffs every prop we bind against Vuetify's
      # own shipped type declarations — the only check in the repo that reads
      # them.
      - name: Check Vuetify props
        run: npm run check:vuetify-props

      # BOTH vitest projects: the `node` tier (pure JS, renders nothing) and the
      # `dom` tier (real components mounted under happy-dom, TODO3 M6). The dom
      # tier fails on an unasserted console.error or [Vue warn], which is the
      # channel a lifecycle-hook throw and a framework deprecation both use.
      - name: Run unit tests
        run: npm run test:unit

      - name: Build frontend
        run: npm run build
